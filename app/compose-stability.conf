// Types the Compose compiler should treat as stable.
//
// Kotlin's collection interfaces carry no stability information — an implementation behind
// `List` could be a MutableList someone mutates in place, so the compiler has to assume the
// worst. That assumption spreads: `Exercise.secondaryMuscles: List<MuscleGroup>` made `Exercise`
// unstable, which made `PlannedExercise` unstable, which made `ExercisePreviewRow` re-run on every
// recomposition of its parent no matter how carefully its other parameters were memoized.
//
// Nothing here stores a list it later mutates. State is held in data classes and replaced with
// `copy`, and every list in one is the result of a `map`/`filter`/`toList`. The builders that do
// use `mutableListOf` return their result and never keep a reference. So the promise below is one
// the codebase already keeps.
//
// The promise is only as good as that invariant: putting a list in state and mutating it in place
// will now silently fail to recompose rather than merely being bad practice.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map

// A row's TalkBack custom actions: a label plus a lambda, both already-stable types, but the
// class itself carries no Compose stability metadata (it's not a data class) so the compiler
// can't infer it. Declared here so `List<CustomAccessibilityAction>` row parameters skip.
androidx.compose.ui.semantics.CustomAccessibilityAction
